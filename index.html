<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorAI</title>
  <meta name="description" content="Offline-first web tutor for grades 6–8, covering math and ELA." />
  <!-- Colours the Android address bar and the standalone splash screen. Must
       match theme_color in the PWA manifest or the install looks half-branded. -->
  <meta name="theme-color" content="#6C63FF" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- iOS ignores the manifest icons and reads this instead. -->
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <!-- Fonts are same-origin now, so the preconnects to fonts.googleapis.com and
       fonts.gstatic.com that used to sit here have nothing to warm up.
       Preloading the body face instead: the CSS that references it is itself a
       render-blocking request, so without this the font is not discovered until
       that stylesheet has parsed. -->
  <link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
